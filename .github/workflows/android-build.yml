name: Android Cloud Build (ProEQ Music Player)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 4. Fix Line 210 & Build APK
        run: |
          GRADLE_SETTINGS=$(find . -maxdepth 4 -name "settings.gradle.kts" | head -n 1)
          if [ -n "$GRADLE_SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$GRADLE_SETTINGS")
            cd "$PROJECT_DIR"
          fi

          # 1. 將 ProEqualizerEngine.kt 的 bassBoost?.let 改為標準 if 判斷，徹底消除第 210 行錯誤
          python3 -c '
          p = "app/src/main/java/com/audiophile/proeqplayer/ProEqualizerEngine.kt"
          txt = open(p).read()
          txt = txt.replace("bassBoost?.let { bb ->", "val bb = bassBoost\n        if (bb != null) {")
          open(p, "w").write(txt)
          '

          # 2. 在 app/build.gradle.kts 加入全域 OptIn 標記，避免 Media3 UnstableApi 警告或錯誤
          python3 -c '
          p = "app/build.gradle.kts"
          txt = open(p).read()
          if "freeCompilerArgs" not in txt:
              txt = txt.replace("jvmTarget = \"17\"", "jvmTarget = \"17\"\n        freeCompilerArgs += listOf(\"-opt-in=androidx.media3.common.util.UnstableApi\", \"-opt-in=androidx.compose.material3.ExperimentalMaterial3Api\")")
              open(p, "w").write(txt)
          '

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager --licenses >/dev/null 2>&1 || true

          gradle assembleDebug assembleRelease --console=plain

      - name: 5. Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProEQ-MusicPlayer-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
          if-no-files-found: error
