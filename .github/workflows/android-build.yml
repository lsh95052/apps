name: Android Cloud Build (ProEQ Music Player v2.0)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Android APK v2.0
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 4. Auto-Upgrade to v2.0 & Build APK
        run: |
          GRADLE_SETTINGS=$(find . -maxdepth 4 -name "settings.gradle.kts" | head -n 1)
          if [ -n "$GRADLE_SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$GRADLE_SETTINGS")
            cd "$PROJECT_DIR"
          fi

          # 自動寫入 v2.0 旗艦版程式碼 (無需手動重傳整個資料夾)
          python3 -c '
          import base64, zlib, json, os
          b64 = "


5IFsQX39X65u88TlrVSj0Y1ooneOPZtvdgz/Z/GgP26wVYuu/9fj/AC2AmOE="
          data = json.loads(zlib.decompress(base64.b64decode(b64)).decode("utf-8"))
          for path, content in data.items():
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          print("Successfully upgraded all source files to v2.0!")
          '

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager --licenses >/dev/null 2>&1 || true

          gradle assembleDebug assembleRelease --console=plain

      - name: 5. Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProEQ-MusicPlayer-v2-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
          if-no-files-found: error
