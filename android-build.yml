name: Android Cloud Build (ProEQ Music Player)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 4. Auto-Patch Kotlin & Build APK
        run: |
          # 自動尋找 settings.gradle.kts 所在目錄
          GRADLE_SETTINGS=$(find . -maxdepth 4 -name "settings.gradle.kts" | head -n 1)
          if [ -n "$GRADLE_SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$GRADLE_SETTINGS")
            cd "$PROJECT_DIR"
          fi

          echo "=== 1. 自動修正 AudioEffect.setEnabled 與 UnstableApi 標註 ==="
          # 將 .enabled = xxx 替換為相容所有 SDK 的 .setEnabled(xxx)
          find app/src -name "*.kt" -exec sed -i 's/\.enabled = \([a-zA-Z0-9_ &><]*\)/.setEnabled(\1)/g' {} +
          # 為 ProEqMusicApp 補上 @OptIn(UnstableApi::class)
          find app/src -name "MainActivity.kt" -exec sed -i 's/@Composable\nfun ProEqMusicApp/@androidx.annotation.OptIn(androidx.media3.common.util.UnstableApi::class)\n@Composable\nfun ProEqMusicApp/g' {} +

          # 在 app/build.gradle.kts 加上全域 OptIn 避免 Media3 UnstableApi 報錯
          if ! grep -q "freeCompilerArgs" app/build.gradle.kts; then
            sed -i 's/jvmTarget = "17"/jvmTarget = "17"\n        freeCompilerArgs += listOf("-opt-in=androidx.media3.common.util.UnstableApi", "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api")/g' app/build.gradle.kts
          fi

          echo "=== 2. 設定 Android SDK 環境 ==="
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager --licenses >/dev/null 2>&1 || true

          echo "=== 3. 開始編譯 APK ==="
          gradle assembleDebug assembleRelease --console=plain

      - name: 5. Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProEQ-MusicPlayer-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
          if-no-files-found: error
