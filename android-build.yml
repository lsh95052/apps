name: Android Cloud Build (ProEQ Music Player)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 4. Fix Line 210 & Build APK
        run: |
          GRADLE_SETTINGS=$(find . -maxdepth 4 -name "settings.gradle.kts" | head -n 1)
          if [ -n "$GRADLE_SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$GRADLE_SETTINGS")
            cd "$PROJECT_DIR"
          fi

          # 自動修正 ProEqualizerEngine.kt 第 210 行的 bassBoost?.let 為 bassBoost?.also
          find app/src -name "ProEqualizerEngine.kt" -exec sed -i 's/bassBoost?\.let/bassBoost?\.also/g' {} +

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager --licenses >/dev/null 2>&1 || true

          gradle assembleDebug assembleRelease --console=plain

      - name: 5. Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProEQ-MusicPlayer-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
          if-no-files-found: error
