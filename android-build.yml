name: Android Cloud Build (ProEQ Music Player)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支援在 GitHub Actions 網頁手動一鍵觸發編譯

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. 檢出專案原始碼 (Checkout Repository)
        uses: actions/checkout@v4

      - name: 2. 安裝 JDK 17 環境 (Setup JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. 配置 Android SDK 環境 (Setup Android SDK)
        uses: android-actions/setup-android@v3

      - name: 4. 配置 Gradle 8.7 雲端編譯引擎 (Setup Gradle)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 5. 執行編譯產生 Debug 與 Release Signed APK
        run: |
          gradle assembleDebug assembleRelease --stacktrace

      - name: 6. 上傳可直接安裝的 APK 產物 (Upload APK Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ProEQ-MusicPlayer-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
